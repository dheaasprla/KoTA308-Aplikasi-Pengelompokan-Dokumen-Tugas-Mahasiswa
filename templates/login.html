<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Pengelompokan Tugas Mahasiswa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <!-- For local viewing without flask, uncomment this and comment the above -->
    <!-- <link rel="stylesheet" href="../static/css/auth.css"> -->
</head>
<body>
    <div class="auth-container">
        <!-- Left Side: Illustration -->
        <div class="auth-left">
            <img src="{{ url_for('static', filename='images/image_9b1523.png') }}" alt="Illustration" class="auth-illustration">
        </div>
        
        <!-- Right Side: Login Form -->
        <div class="auth-right">
            <div class="auth-form-wrapper">
                <img src="{{ url_for('static', filename='images/image_909eb7.png') }}" alt="Logo SPTM" class="brand-logo">
                <h1 class="auth-title">Sistem Pengelompokan Tugas Mahasiswa (SPTM)</h1>
                <p class="auth-subtitle">Selamat Datang! Tolong masukkan data anda</p>

                {% if error %}
                <p class="error-message-global" style="color: #ff4d4f; margin-bottom: 15px; font-weight: 500; text-align: center;">{{ error }}</p>
                {% endif %}

                <form id="loginForm" action="{{ url_for('auth.login') }}" method="POST">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Masukkan Email" required>
                        <span class="error-message" id="emailError">Format email tidak valid (harus mengandung '@')</span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Kata sandi</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan Kata Sandi" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>
                </form>
                
                <div class="divider">atau</div>
                
                <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline" style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    Lanjutkan dengan Google
                    <!-- Google SVG Icon on the RIGHT -->
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36365H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z" fill="#4285F4"/>
                        <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4205 9 14.4205C6.65591 14.4205 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z" fill="#34A853"/>
                        <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.82999 3.96409 7.29V4.95818H0.957275C0.347727 6.17318 0 7.54773 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
                        <path d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/>
                    </svg>
                </a>
                
                <div class="auth-footer">
                    Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/auth.js') }}" onerror="this.src='../static/js/auth.js'"></script>
</body>
</html>
