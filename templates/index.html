<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengelompokan Tugas SBERT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 40px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #bdc3c7; border-radius: 5px; }
        input[type="range"] { width: 100%; }
        .threshold-value { font-size: 1.2em; font-weight: bold; color: #2980b9; text-align: center; display: block; }
        button { width: 100%; background: #27ae60; color: #fff; border: none; padding: 15px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #219a52; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sesi Analisis Tugas</h1>
        <p style="text-align: center; color: #7f8c8d;">Unggah berkas PDF secara massal untuk mendeteksi kelompok kemiripan.</p>
        
        <form action="/process" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="pdf_files">Pilih Dokumen (.pdf):</label>
                <input type="file" name="pdf_files" id="pdf_files" accept=".pdf" multiple required>
                <small style="color: #95a5a6;">Bisa memilih lebih dari 1 dokumen sekaligus.</small>
            </div>

            <div class="form-group">
                <label for="threshold">Ambang Batas Kemiripan (Threshold):</label>
                <input type="range" name="threshold" id="threshold" min="0.1" max="1.0" step="0.05" value="0.70" oninput="document.getElementById('t_val').innerText = this.value">
                <span class="threshold-value" id="t_val">0.70</span>
            </div>

            <button type="submit">Mulai Analisis SBERT</button>
        </form>
    </div>
</body>
</html>
