<style>
    .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .modal-backdrop.show,
    .modal-backdrop.active {
        display: flex;
        opacity: 1;
    }

    .modal-card {
        background-color: #ffffff;
        border-radius: 16px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        position: relative;
        transform: scale(0.92);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.show .modal-card,
    .modal-backdrop.active .modal-card {
        transform: scale(1);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    .modal-header h2 {
        font-size: 16px;
        font-weight: 700;
        color: #03254C;
    }

    .btn-close-modal {
        background: none;
        border: none;
        color: #EF4444;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-close-modal:hover {
        transform: scale(1.25);
    }

    .modal-description {
        font-size: 13px;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 16px;
        text-align: left;
        font-weight: 500;
    }

    .slider-hint {
        font-size: 13px;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 24px;
        text-align: left;
        font-weight: 500;
    }

    .threshold-control-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 36px;
        width: 100%;
        padding: 0 8px;
    }

    .premium-slider {
        flex-grow: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 10px;
        border-radius: 5px;
        background: #E2E8F0;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.15);
        outline: none;
    }

    .premium-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 6px;
        height: 18px;
        background-color: #03254C;
        border-radius: 2px;
        cursor: pointer;
        border: none;
    }

    .premium-slider:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .premium-slider:disabled::-webkit-slider-thumb {
        cursor: not-allowed;
    }

    .threshold-display {
        font-size: 13px;
        font-weight: 700;
        color: #000000;
        min-width: 40px;
        text-align: left;
    }

    .modal-actions-center {
        display: flex;
        justify-content: center;
    }

    .btn-submit-analysis {
        background-color: #03254C;
        color: #ffffff;
        border: none;
        padding: 10px 24px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 160px;
        justify-content: center;
    }

    .btn-submit-analysis:hover {
        background-color: #021a36;
    }

    .btn-submit-analysis:disabled {
        background-color: #021a36;
        cursor: not-allowed;
        opacity: 0.85;
    }

    .fa-spin {
        animation: fa-spin 1s linear infinite;
    }

    @keyframes fa-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<div class="modal-backdrop" id="modal-threshold">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Konfigurasi Threshold Kemiripan</h2>
            <button type="button" class="btn-close-modal" id="btn-close-modal">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <p class="modal-description">
                Tentukan batas persentase kemiripan untuk mendeteksi duplikasi dokumen.
                Sistem menggunakan threshold default 70%, yang dapat diubah sebelum analisis dimulai.
            </p>
            <p class="slider-hint">
                Geser slider ke kiri untuk menurunkan nilai threshold, atau ke kanan untuk menaikkannya.
            </p>

            <form action="#" method="POST" id="form-threshold">
                <div class="threshold-control-row">
                    <input type="range" name="threshold" id="input-threshold" min="0" max="100"
                        value="70" class="premium-slider" title="Geser kiri untuk menurunkan, kanan untuk menaikkan">
                    <div class="threshold-display">
                        <span id="threshold-display-val">70</span>%
                    </div>
                </div>

                <div class="modal-actions-center">
                    <button type="submit" class="btn-submit-analysis" id="btn-submit-analysis">
                        <i class="fa-solid fa-play" id="icon-submit"></i>
                        <span id="label-submit">Mulai Analisis</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const modalBackdrop = document.getElementById('modal-threshold');
        const btnReanalyze = document.getElementById('btn-reanalyze');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const inputThreshold = document.getElementById('input-threshold');
        const thresholdDisplayVal = document.getElementById('threshold-display-val');
        const formThreshold = document.getElementById('form-threshold');
        const btnSubmit = document.getElementById('btn-submit-analysis');
        const iconSubmit = document.getElementById('icon-submit');
        const labelSubmit = document.getElementById('label-submit');

        if (btnReanalyze) {
            btnReanalyze.addEventListener('click', function (e) {
                e.preventDefault();

                const icon = this.querySelector('i');
                if (icon) {
                    icon.classList.add('fa-spin');
                    setTimeout(() => {
                        icon.classList.remove('fa-spin');
                    }, 500);
                }

                resetModal();

                modalBackdrop.style.display = 'flex';
                setTimeout(() => {
                    modalBackdrop.classList.add('show');
                }, 10);
            });
        }

        if (btnCloseModal) {
            btnCloseModal.addEventListener('click', closeModal);
        }

        if (modalBackdrop) {
            modalBackdrop.addEventListener('click', function (e) {
                if (e.target === modalBackdrop) {
                    closeModal();
                }
            });
        }

        function closeModal() {
            if (btnSubmit && btnSubmit.disabled) return;

            modalBackdrop.classList.remove('show');
            modalBackdrop.classList.remove('active');
            setTimeout(() => {
                modalBackdrop.style.display = 'none';
            }, 250);
        }

        function resetModal() {
            if (inputThreshold) {
                inputThreshold.disabled = false;
                inputThreshold.style.pointerEvents = 'auto';
                inputThreshold.style.opacity = '1';
            }
            if (btnSubmit) {
                btnSubmit.disabled = false;
            }
            if (iconSubmit) {
                iconSubmit.className = 'fa-solid fa-play';
            }
            if (labelSubmit) {
                labelSubmit.textContent = 'Mulai Analisis';
            }
            if (btnCloseModal) {
                btnCloseModal.style.display = '';
            }
            const errorEl = document.getElementById('modal-error-msg');
            if (errorEl) errorEl.textContent = '';
        }

        if (inputThreshold && thresholdDisplayVal) {
            inputThreshold.addEventListener('input', function () {
                thresholdDisplayVal.textContent = this.value;
            });
        }

        if (formThreshold) {
            formThreshold.addEventListener('submit', function (e) {
                e.preventDefault();

                const thresholdValue = inputThreshold ? inputThreshold.value : 70;
                const formAction = formThreshold.action;
                const idSesi = formAction.split('/sesi/')[1].split('/')[0];

                if (inputThreshold) {
                    inputThreshold.style.pointerEvents = 'none';
                    inputThreshold.style.opacity = '0.5';
                }
                if (btnSubmit) btnSubmit.disabled = true;
                if (iconSubmit) iconSubmit.className = 'fa-solid fa-arrows-rotate fa-spin';
                if (labelSubmit) labelSubmit.textContent = 'Menganalisis...';
                if (btnCloseModal) btnCloseModal.style.display = 'none';

                const formData = new FormData();
                formData.append('threshold', thresholdValue);

                fetch(`/sesi/${idSesi}/hasil-klaster`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => {
                    if (!res.ok) throw new Error('Gagal menyimpan threshold.');
                    return fetch(`/analisis/sesi/${idSesi}/jalankan`, {
                        method: 'POST'
                    });
                })
                .then(res => res.json().then(data => ({ status: res.status, data })))
                .then(({ status, data }) => {
                    if (status === 200 && data.status === 'selesai') {
                        window.location.href = `/analisis/sesi/${idSesi}/hasil`;
                    } else if (status === 400) {
                        tampilkanError(data.pesan || 'Validasi gagal.');
                    } else if (status === 500) {
                        tampilkanError(data.pesan || 'Analisis gagal. Silakan coba kembali.');
                    } else {
                        tampilkanError('Terjadi kesalahan tidak terduga.');
                    }
                })
                .catch(err => {
                    tampilkanError('Terjadi kesalahan: ' + err.message);
                });
            });
        }

        function tampilkanError(pesan) {
            if (inputThreshold) {
                inputThreshold.style.pointerEvents = 'auto';
                inputThreshold.style.opacity = '1';
            }
            if (btnSubmit) btnSubmit.disabled = false;
            if (iconSubmit) iconSubmit.className = 'fa-solid fa-play';
            if (labelSubmit) labelSubmit.textContent = 'Mulai Analisis';
            if (btnCloseModal) btnCloseModal.style.display = '';

            let errorEl = document.getElementById('modal-error-msg');
            if (!errorEl) {
                errorEl = document.createElement('p');
                errorEl.id = 'modal-error-msg';
                errorEl.style.cssText = 'color:#EF4444; font-size:13px; text-align:center; margin-top:12px;';
                document.querySelector('.modal-actions-center').after(errorEl);
            }
            errorEl.textContent = pesan;

            setTimeout(() => {
                errorEl.textContent = '';
            }, 6000);
        }
    });
</script>
